name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH key and payload
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          mkdir -p site
          echo "${GITHUB_SHA::7} ${GITHUB_REF_NAME} $(date -u +%FT%TZ)" > site/.build

      - name: Rsync to origin
        run: |
          rsync -az --delete -e "ssh -o StrictHostKeyChecking=accept-new" site/ "${{ secrets.DEPLOY_TARGET }}"

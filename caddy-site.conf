
# archerdevteam.com — static site (2026-11-08). Runtime-applied via admin API until
# persisted into this file by root; self-heal: /home/agent/sites/archerdevteam/reapply-caddy.sh
http://archerdevteam.com, http://www.archerdevteam.com {
	encode zstd gzip
	@www host www.archerdevteam.com
	redir @www https://archerdevteam.com{uri} permanent
	@static path /assets/*
	header @static Cache-Control "public, max-age=604800"
	root * /home/agent/sites/archerdevteam/www
	file_server
}
